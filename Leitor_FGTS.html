<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor de Extrato FGTS por Obra</title>
<style>:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.container{max-width:1500px;margin:0 auto;padding:28px}header h1{margin-bottom:6px}.card{background:white;border:1px solid #dfe3ea;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}.controls{display:grid;gap:12px}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{padding:10px 18px;border:0;border-radius:7px;background:#1f5b45;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}progress{width:100%;height:20px}.status,.summary{padding:10px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left;white-space:nowrap}th{background:#eef2f5}thead th{position:sticky;top:0}@media print{.controls{display:none}.container{max-width:none;padding:0}.card{box-shadow:none;border:0}table{font-size:9px}th,td{white-space:normal;padding:4px}thead th{position:static}}</style></head><body>
<main class="container"><header><h1>Leitor de Extrato — FGTS por Obra</h1><p>Extrato Mensal, Complementar ou Consolidado → planilha para FGTS por obra.</p></header>
<section class="card controls"><label>Extrato em PDF</label><input id="pdfFile" type="file" accept="application/pdf,.pdf"><div class="buttons"><button id="processBtn">Processar PDF</button><button id="exportBtn" disabled>Baixar XLSX</button><button id="printBtn" disabled>Imprimir / Salvar PDF</button></div><progress id="progress" max="100" value="0"></progress><div id="progressText">Aguardando arquivo — 0%</div><div id="status" class="status">Selecione um extrato para iniciar.</div></section>
<section class="card"><div id="summary" class="summary"></div><div class="table-wrap"><table><thead><tr><th>Codigo</th><th>Tipo Inscrição</th><th>Servico</th><th>TAG</th><th>Inscrição</th><th>FGTS</th><th>FGTS Aprendiz</th><th>Total FGTS</th></tr></thead><tbody id="resultBody"></tbody></table></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const HOLIDAYS=['2026-01-01','2026-04-03','2026-04-21','2026-05-01','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25'];
const onlyDigits=v=>String(v??'').replace(/\D/g,'');
function parseCompetence(v){const m=String(v).match(/\b(0[1-9]|1[0-2])\/(20\d{2})\b/);return m?{month:+m[1],year:+m[2],label:`${m[1]}/${m[2]}`}:null}
function normalizeRegistration(v,type){const d=onlyDigits(v),n=type.toUpperCase()==='CNPJ'?14:12;return{value:d.padStart(n,'0').slice(-n),valid:d.length===n}}
function parseBRL(v){const n=Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0}
function buildTag(code,service,reg){const r=onlyDigits(reg),base=`${code}-${service}`.trim(),max=Math.max(0,40-r.length-1);return `${base.slice(0,max).trimEnd()} ${r}`.trim()}
function due(comp){let d=new Date(comp.year,comp.month,20,12),set=new Set(HOLIDAYS);const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;while(d.getDay()===0||d.getDay()===6||set.has(iso(d)))d.setDate(d.getDate()-1);return d}
const dateBR=d=>new Intl.DateTimeFormat('pt-BR').format(d),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
function competenceFromItems(items){const label=items.find(i=>/Compet[eê]ncia\s*:/i.test(i.str));if(!label)return null;const x=label.transform?.[4]??0,y=label.transform?.[5]??0;const c=items.filter(i=>/^\s*(0[1-9]|1[0-2])\/(20\d{2})\s*$/.test(i.str)).map(i=>({i,x:i.transform?.[4]??0,y:i.transform?.[5]??0})).filter(a=>a.x>x&&Math.abs(a.y-y)<=5).sort((a,b)=>a.x-b.x);return c.length?parseCompetence(c[0].i.str.trim()):null}
const SERVICE=/Servi[cç]o:\s*(\d+)\s*-\s*(.*?)\s*-\s*(CNO|CNPJ):\s*([\d.\/-]+)/i;
function total(block){const a=block.lastIndexOf('Resumo por Rubricas do Serviço'),b=block.lastIndexOf('Líquido Serviço:'),s=block.slice(Math.max(a,b,0));const f=s.match(/\bValor do FGTS:\s*([\d.]+,\d{2})/i),ap=s.match(/\bValor do FGTS Aprendiz:\s*([\d.]+,\d{2})/i);return{fgts:f?parseBRL(f[1]):0,aprendiz:ap?parseBRL(ap[1]):0}}
let result=null,dueDate=null;
async function processPdf(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[];let comp=null;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent();if(p===1){comp=competenceFromItems(content.items);if(!comp)throw Error('Não foi possível ler a competência à direita de "Competência:" no cabeçalho da página 1.')}const text=content.items.map(i=>i.str).join(' ').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ');pages.push(`\n[[PAGE:${p}]]\n${text}`);progress.value=Math.round(p/pdf.numPages*60);progressText.textContent=`Lendo PDF — ${p}/${pdf.numPages}`}
const full=pages.join('\n'),ms=[...full.matchAll(new RegExp(SERVICE.source,'gi'))],map=new Map();for(let i=0;i<ms.length;i++){const m=ms[i],block=full.slice(m.index,ms[i+1]?.index??full.length),reg=normalizeRegistration(m[4],m[3]),t=total(block),item={code:+m[1],registrationType:m[3].toUpperCase(),service:m[2].trim(),registration:reg.value,fgts:t.fgts,apprenticeFgts:t.aprendiz};map.set(`${item.code}|${item.registration}`,item)}result={competence:comp,services:[...map.values()].sort((a,b)=>a.code-b.code)};dueDate=due(comp);render();progress.value=100;progressText.textContent='Concluído — 100%'}
function rows(){return result.services.map(i=>({Codigo:i.code,Tipo:i.registrationType,Servico:i.service,TAG:buildTag(i.code,i.service,i.registration),Inscricao:i.registration,FGTS:i.fgts,Aprendiz:i.apprenticeFgts,Total:i.fgts+i.apprenticeFgts}))}
function render(){const rs=rows();resultBody.innerHTML='';for(const r of rs){const tr=document.createElement('tr');[r.Codigo,r.Tipo,r.Servico,r.TAG,r.Inscricao,money(r.FGTS),money(r.Aprendiz),money(r.Total)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});resultBody.appendChild(tr)}summary.innerHTML=`<strong>Competência:</strong> ${result.competence.label} &nbsp; | &nbsp; <strong>Vencimento:</strong> ${dateBR(dueDate)} &nbsp; | &nbsp; <strong>Serviços:</strong> ${rs.length}`;exportBtn.disabled=false;printBtn.disabled=false}
function exportXlsx(){const r=rows(),last=r.length+3,data=[['Competência',result.competence.label,'','Vencimento',dateBR(dueDate)],[],['Codigo','Tipo Inscrição','Servico','TAG','Inscrição','FGTS','FGTS Aprendiz','Total FGTS'],...r.map(x=>[x.Codigo,x.Tipo,x.Servico,x.TAG,x.Inscricao,x.FGTS,x.Aprendiz,null])],ws=XLSX.utils.aoa_to_sheet(data);for(let n=4;n<=last;n++){if(ws[`E${n}`]){ws[`E${n}`].t='s';ws[`E${n}`].z='@';ws[`E${n}`].v=String(ws[`E${n}`].v)}for(const c of ['F','G'])if(ws[`${c}${n}`])ws[`${c}${n}`].z='#,##0.00';ws[`H${n}`]={t:'n',f:`SUM(F${n}:G${n})`,z:'#,##0.00'}}ws['!cols']=[{wch:10},{wch:16},{wch:42},{wch:42},{wch:18},{wch:16},{wch:16},{wch:16}];ws['!autofilter']={ref:`A3:H${Math.max(3,last)}`};const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'FGTS por Obra');XLSX.writeFile(wb,`FGTS_Extrator_${String(result.competence.month).padStart(2,'0')}${result.competence.year}.xlsx`,{compression:true})}
processBtn.onclick=async()=>{const f=pdfFile.files?.[0];if(!f){status.textContent='Selecione um PDF.';return}processBtn.disabled=true;exportBtn.disabled=true;printBtn.disabled=true;status.textContent='Processando...';try{await processPdf(f);status.textContent='Concluído.'}catch(e){status.textContent=`Erro: ${e.message}`;console.error(e)}finally{processBtn.disabled=false}};exportBtn.onclick=exportXlsx;printBtn.onclick=()=>window.print();
</script></body></html>
